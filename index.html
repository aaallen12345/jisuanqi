<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>赔率分配计算器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #172033;
      --muted: #687286;
      --line: #d9dee8;
      --accent: #0f766e;
      --accent-soft: #e4f4f1;
      --danger: #b42318;
      --shadow: 0 18px 44px rgba(23, 32, 51, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    main {
      width: min(1080px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: clamp(22px, 5vw, 42px);
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(26px, 4vw, 38px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }

    .settings {
      max-width: 260px;
      margin-bottom: 24px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .column {
      min-width: 0;
    }

    .entry {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .amount-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }

    .amount-field {
      min-width: 120px;
    }

    .amount-field span {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .peso,
    .peso-preview {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
    }

    .peso-preview {
      min-height: 15px;
      margin-left: 2px;
    }

    input {
      width: 100%;
      min-width: 0;
      min-height: 56px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 16px;
      color: var(--text);
      font-size: 22px;
      line-height: 1;
      outline: none;
      font-variant-numeric: tabular-nums;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.14);
    }

    .copy-button {
      width: 100%;
      margin-top: 14px;
      min-height: 56px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
      min-height: 266px;
    }

    .placeholder,
    .error,
    .mode {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .error {
      color: var(--danger);
      font-weight: 650;
    }

    .mode {
      margin-bottom: 14px;
      color: var(--accent);
      font-weight: 700;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    li {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 17px;
      line-height: 1.35;
    }

    .value {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    .value strong {
      display: block;
    }

    .profit {
      margin-top: 16px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 16px;
      font-size: 22px;
      font-weight: 850;
      line-height: 1.25;
      font-variant-numeric: tabular-nums;
    }

    .loss {
      background: #fef3f2;
      color: var(--danger);
    }

    @media (max-width: 560px) {
      main {
        padding: 20px;
      }

      .workspace,
      .entry,
      .amount-grid {
        display: grid;
        grid-template-columns: 1fr;
      }

      .result {
        min-height: 0;
      }

      li {
        display: grid;
        gap: 6px;
      }

      .value {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>赔率分配计算器</h1>

    <section class="settings">
      <label for="exchangeRateInput">菲律宾披索汇率</label>
      <input id="exchangeRateInput" inputmode="decimal" autocomplete="off" value="61.78">
    </section>

    <div class="workspace">
      <section class="column">
        <label for="oddsInput">输入两个或三个赔率</label>
        <div class="entry">
          <input id="oddsInput" autocomplete="off" placeholder="2.867 1.57 或 2.1,3.2,4.5" autofocus>
        </div>

        <section id="allocationResult" class="result" aria-live="polite">
          <p class="placeholder">输入两个或三个赔率后，按总投注 $100 展示投注分配。</p>
        </section>

        <button id="copyAllocationButton" class="copy-button" type="button">复制结果</button>
      </section>

      <section class="column">
        <label>输入押注金额</label>
        <div id="amountInputs" class="amount-grid"></div>

        <section id="amountResult" class="result" aria-live="polite">
          <p class="placeholder">先输入赔率，再输入任意一项金额。</p>
        </section>

        <button id="copyAmountButton" class="copy-button" type="button">复制结果</button>
      </section>
    </div>
  </main>

  <script>
    const TOTAL_STAKE = 100;
    const DEFAULT_EXCHANGE_RATE = 61.78;
    const DEFAULT_BASE_STAKE = 100;
    const oddsInput = document.querySelector("#oddsInput");
    const exchangeRateInput = document.querySelector("#exchangeRateInput");
    const amountInputs = document.querySelector("#amountInputs");
    const allocationResult = document.querySelector("#allocationResult");
    const amountResult = document.querySelector("#amountResult");
    const copyAllocationButton = document.querySelector("#copyAllocationButton");
    const copyAmountButton = document.querySelector("#copyAmountButton");
    let latestAllocationText = "";
    let latestAmountText = "";
    let activeOdds = loadOdds();
    let activeAmountIndex = null;
    let amountInputCount = 0;
    let isSyncingAmounts = false;

    const DEFAULT_TITLE = "赔率分配计算器";

    function setMatchTitle(match) {
      const title = String(match || "").trim() || DEFAULT_TITLE;
      const heading = document.querySelector("h1");
      if (heading) heading.textContent = title;
      document.title = title;
    }

    function applyPrefillFromHash() {
      const rawHash = window.location.hash.replace(/^#/, "");
      if (!rawHash) return false;
      const params = new URLSearchParams(rawHash);
      const match = params.get("match") || "";
      const odds = params.get("odds") || "";
      if (match) setMatchTitle(match);
      if (odds) {
        oddsInput.value = odds;
        renderAllocation();
        return true;
      }
      return Boolean(match);
    }

    function yuan(value) {
      return `$${value.toFixed(2)}`;
    }

    function peso(value) {
      return `≈ ₱${value.toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      })}`;
    }

    function getExchangeRate() {
      const rate = Number(exchangeRateInput.value);
      return Number.isFinite(rate) && rate > 0 ? rate : DEFAULT_EXCHANGE_RATE;
    }

    function pesoFromYuan(value) {
      return peso(value * getExchangeRate());
    }

    function parseNumbers(text) {
      return text
        .trim()
        .split(/[\s,，、/]+/)
        .filter(Boolean)
        .map(Number);
    }

    function loadOdds() {
      try {
        const saved = JSON.parse(localStorage.getItem("activeOdds") || "null");
        if (Array.isArray(saved) && (saved.length === 2 || saved.length === 3) && saved.every((odd) => Number.isFinite(odd) && odd > 1)) {
          return saved;
        }
      } catch {
        return null;
      }

      return null;
    }

    function saveOdds(odds) {
      activeOdds = odds;
      localStorage.setItem("activeOdds", JSON.stringify(odds));
    }

    function labelFor(index) {
      return String.fromCharCode(65 + index);
    }

    function oddsText(odds) {
      return odds.map((odd, index) => `${labelFor(index)} ${odd}`).join(" / ");
    }

    function getBalancedStakes(odds, totalStake) {
      const inverseTotal = odds.reduce((sum, odd) => sum + 1 / odd, 0);
      return odds.map((odd) => totalStake * (1 / odd) / inverseTotal);
    }

    function getStakesFromBase(baseStake, baseIndex, odds) {
      const payout = baseStake * odds[baseIndex];
      return odds.map((odd, index) => index === baseIndex ? baseStake : payout / odd);
    }

    function getAmountInputElements() {
      return Array.from(amountInputs.querySelectorAll(".amount-input"));
    }

    function getPesoPreviewElements() {
      return Array.from(amountInputs.querySelectorAll(".peso-preview"));
    }

    function clearPesoPreviews() {
      getPesoPreviewElements().forEach((preview) => {
        preview.textContent = "";
      });
    }

    function updatePesoPreviews(stakes) {
      getPesoPreviewElements().forEach((preview, index) => {
        preview.textContent = Number.isFinite(stakes[index]) ? pesoFromYuan(stakes[index]) : "";
      });
    }

    function buildAmountInputs(count) {
      if (amountInputCount === count) {
        return;
      }

      amountInputCount = count;
      activeAmountIndex = null;
      latestAmountText = "";

      if (!count) {
        amountInputs.innerHTML = "";
        return;
      }

      amountInputs.innerHTML = Array.from({ length: count }, (_, index) => `
        <div class="amount-field">
          <span>押 ${labelFor(index)}</span>
          <input class="amount-input" data-index="${index}" inputmode="decimal" autocomplete="off" placeholder="${labelFor(index)} 金额">
          <small class="peso-preview"></small>
        </div>
      `).join("");

      getAmountInputElements().forEach((input) => {
        input.addEventListener("input", () => {
          if (isSyncingAmounts) {
            return;
          }

          renderAmount(Number(input.dataset.index));
        });
      });

      const firstInput = getAmountInputElements()[0];
      if (firstInput) {
        firstInput.value = String(DEFAULT_BASE_STAKE);
        activeAmountIndex = 0;
      }
    }

    function renderCalculation(target, stakes, odds, modeText) {
      const payouts = stakes.map((stake, index) => stake * odds[index]);
      const guaranteedReturn = Math.min(...payouts);
      const totalStake = stakes.reduce((sum, stake) => sum + stake, 0);
      const profit = guaranteedReturn - totalStake;
      const profitClass = profit >= 0 ? "profit" : "profit loss";
      const profitLabel = profit >= 0 ? "稳赚约" : "预计亏损约";

      const text = [
        ...stakes.map((stake, index) => `* 押 ${labelFor(index)}：${yuan(stake)}（${pesoFromYuan(stake)}）`),
        ...payouts.map((payout, index) => `* ${labelFor(index)}赢：${yuan(payout)}（${pesoFromYuan(payout)}）`),
        `→ ${profitLabel}：${yuan(Math.abs(profit))}（${pesoFromYuan(Math.abs(profit))}）`
      ].join("\n");

      target.innerHTML = `
        <p class="mode">${modeText}</p>
        <ul>
          ${stakes.map((stake, index) => `<li><span>押 ${labelFor(index)}</span><span class="value"><strong>${yuan(stake)}</strong><small class="peso">${pesoFromYuan(stake)}</small></span></li>`).join("")}
          ${payouts.map((payout, index) => `<li><span>${labelFor(index)} 赢</span><span class="value"><strong>${yuan(payout)}</strong><small class="peso">${pesoFromYuan(payout)}</small></span></li>`).join("")}
        </ul>
        <div class="${profitClass}">→ ${profitLabel}：${yuan(Math.abs(profit))}<small class="peso">${pesoFromYuan(Math.abs(profit))}</small></div>
      `;

      return text;
    }

    function renderAllocation() {
      const raw = oddsInput.value.trim();
      latestAllocationText = "";

      if (!raw) {
        allocationResult.innerHTML = '<p class="placeholder">输入两个或三个赔率后，按总投注 $100 展示投注分配。</p>';
        activeOdds = null;
        localStorage.removeItem("activeOdds");
        buildAmountInputs(0);
        renderAmount();
        return;
      }

      const numbers = parseNumbers(raw);
      if (numbers.some((number) => !Number.isFinite(number) || number <= 0)) {
        allocationResult.innerHTML = '<p class="error">请输入两个或三个有效赔率，中间用空格隔开。</p>';
        activeOdds = null;
        localStorage.removeItem("activeOdds");
        latestAmountText = "";
        buildAmountInputs(0);
        amountResult.innerHTML = '<p class="error">赔率无效，无法计算金额。</p>';
        return;
      }

      if (numbers.length !== 2 && numbers.length !== 3) {
        allocationResult.innerHTML = '<p class="error">只输入两个或三个赔率，例如：2.867 1.57 或 2.1 3.2 4.5。</p>';
        activeOdds = null;
        localStorage.removeItem("activeOdds");
        latestAmountText = "";
        buildAmountInputs(0);
        amountResult.innerHTML = '<p class="error">赔率无效，无法计算金额。</p>';
        return;
      }

      if (numbers.some((odd) => odd <= 1)) {
        allocationResult.innerHTML = '<p class="error">赔率必须大于 1。</p>';
        activeOdds = null;
        localStorage.removeItem("activeOdds");
        latestAmountText = "";
        buildAmountInputs(0);
        amountResult.innerHTML = '<p class="error">赔率无效，无法计算金额。</p>';
        return;
      }

      const odds = numbers;
      saveOdds(odds);
      buildAmountInputs(odds.length);
      const stakes = getBalancedStakes(odds, TOTAL_STAKE);
      latestAllocationText = renderCalculation(
        allocationResult,
        stakes,
        odds,
        "按总投注 $100 分配"
      );
      renderAmount();
    }

    function renderAmount(changedIndex = null) {
      latestAmountText = "";

      if (!activeOdds) {
        buildAmountInputs(0);
        amountResult.innerHTML = '<p class="placeholder">先输入赔率，再输入任意一项金额。</p>';
        return;
      }

      buildAmountInputs(activeOdds.length);
      const inputs = getAmountInputElements();

      if (changedIndex !== null) {
        activeAmountIndex = changedIndex;
      }

      if (changedIndex !== null && inputs[changedIndex] && !inputs[changedIndex].value.trim()) {
        activeAmountIndex = null;
        isSyncingAmounts = true;
        inputs.forEach((input, index) => {
          if (index !== changedIndex) {
            input.value = "";
          }
        });
        isSyncingAmounts = false;
        clearPesoPreviews();
        amountResult.innerHTML = `<p class="placeholder">当前赔率：${oddsText(activeOdds)}。输入 A/B${activeOdds.length === 3 ? "/C" : ""} 任意一项金额后自动计算其它金额。</p>`;
        return;
      }

      let baseIndex = activeAmountIndex;
      if (baseIndex === null || !inputs[baseIndex] || !inputs[baseIndex].value.trim()) {
        baseIndex = inputs.findIndex((input) => input.value.trim());
      }

      if (baseIndex === -1) {
        activeAmountIndex = null;
        clearPesoPreviews();
        amountResult.innerHTML = `<p class="placeholder">当前赔率：${oddsText(activeOdds)}。输入 A/B${activeOdds.length === 3 ? "/C" : ""} 任意一项金额后自动计算其它金额。</p>`;
        return;
      }

      activeAmountIndex = baseIndex;
      const raw = inputs[baseIndex].value.trim();
      const numbers = parseNumbers(raw);
      if (numbers.length !== 1 || !Number.isFinite(numbers[0]) || numbers[0] <= 0) {
        clearPesoPreviews();
        amountResult.innerHTML = '<p class="error">每个金额框只输入一个有效金额，例如：300。</p>';
        return;
      }

      const baseStake = numbers[0];
      const stakes = getStakesFromBase(baseStake, baseIndex, activeOdds);
      const payouts = stakes.map((stake, index) => stake * activeOdds[index]);
      const totalStake = stakes.reduce((sum, stake) => sum + stake, 0);
      const profit = Math.min(...payouts) - totalStake;
      const profitRate = profit / totalStake * 100;

      isSyncingAmounts = true;
      inputs.forEach((input, index) => {
        if (index !== baseIndex) {
          input.value = stakes[index].toFixed(2);
        }
      });
      isSyncingAmounts = false;
      updatePesoPreviews(stakes);

      latestAmountText = renderCalculation(
        amountResult,
        stakes,
        activeOdds,
        `总投注额：${yuan(totalStake)}，利润率：${profitRate.toFixed(2)}%`
      );
    }

    async function writeClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }

      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.setAttribute("readonly", "");
      textArea.style.position = "fixed";
      textArea.style.left = "-9999px";
      document.body.appendChild(textArea);
      textArea.select();
      const copied = document.execCommand("copy");
      textArea.remove();
      return copied;
    }

    async function copyResult(getText, button) {
      const text = getText();
      if (!text) {
        return;
      }

      const original = button.textContent;
      const copied = await writeClipboard(text);
      button.textContent = copied ? "已复制" : "复制失败";
      setTimeout(() => {
        button.textContent = original;
      }, 900);
    }

    if (activeOdds) {
      oddsInput.value = activeOdds.join(" ");
    }

    oddsInput.addEventListener("input", renderAllocation);
    exchangeRateInput.addEventListener("input", () => {
      renderAllocation();
    });
    copyAllocationButton.addEventListener("click", () => copyResult(() => latestAllocationText, copyAllocationButton));
    copyAmountButton.addEventListener("click", () => copyResult(() => latestAmountText, copyAmountButton));
    renderAllocation();
    applyPrefillFromHash();
    window.addEventListener("hashchange", applyPrefillFromHash);
  </script>
</body>
</html>
